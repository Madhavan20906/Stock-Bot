name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install core dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pandas numpy scikit-learn loguru pyyaml
          pip install ta
          pip install stable-baselines3 gymnasium
          pip install pytest pytest-cov
          pip install -e .

      - name: Run unit tests
        run: |
          pip install pandas-ta --find-links https://pypi.org/simple/ || pip install ta
          pytest tests/unit/test_lstm_model.py tests/unit/test_signals.py tests/unit/test_risk.py tests/unit/test_environment.py -v --tb=short

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mypy
        run: |
          pip install mypy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Type check
        run: mypy src/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true